services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: packv-web:latest
    environment:
      PACKV_HOST: 0.0.0.0
      PACKV_PORT: "8080"
    ports:
      # 宿主机端口可通过 .env 中的 PACKV_HOST_PORT 配置，默认 8080。
      - "${PACKV_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2); sys.exit(0 if r.status==200 and json.loads(r.read())['status']=='ok' else 1)"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: packv-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:8080
    # 实际执行：构建检查 + 解码规则测试（含真实 git pack 交叉校验）
    # + 针对 web 的 HTTP 冒烟（嵌套 OFS_DELTA、损坏尾部摘要等），
    # 以退出码报告验收结果（0 通过 / 非 0 失败）。
    command: ["python", "scripts/verify.py"]
    restart: "no"
